yamaha:

    dev:
        yamahayxc_host: 127.0.0.1

        mc_playlist:
            type: num
            yamahayxc_cmd: mc_playlist

        main:
            yamahayxc_zone: main

            power:
                type: bool
                yamahayxc_cmd: power

            volume_mixed_case:
                type: num
                yamahayxc_cmd: Volume

            power_num:
                type: num
                yamahayxc_cmd: power

            mute_num:
                type: num
                yamahayxc_cmd: mute

            tuner_dab_service:
                type: str
                yamahayxc_cmd: tuner_dab_service

            tuner_dab_scan:
                type: bool
                yamahayxc_cmd: tuner_dab_scan

            tuner_auto_preset:
                type: bool
                yamahayxc_cmd: tuner_auto_preset
