yamaha:

    dev:
        yamahayxc_host: 127.0.0.1
        yamahayxc_inputs:
            - tuner
            - hdmi1: Fire TV
            - 'av3=A, B'
            - 'nope=Unknown'

        main:
            yamahayxc_zone: main

            input_values:
                type: list
                yamahayxc_cmd: input_sources

            input_names:
                type: list
                yamahayxc_cmd: input_names
