# Metadata for the Smart-Plugin
plugin:
    # Global plugin attributes
    type: system                  # plugin type (gateway, interface, protocol, system, web)
    description:                  # Alternative: description in multiple languages
        de: 'Database plugin, mit Unterstützung für SQLite 3, MySQL/MariaDB und PostgreSQL+TimescaleDB'
        en: 'Database plugin, with support for SQLite 3, MySQL/MariaDB and PostgreSQL+TimescaleDB'
    maintainer: ohinckel, msinn, onkelandy
    tester: psilo909, brandst, aschwith
    state: ready
    keywords: database
    support: https://knx-user-forum.de/forum/supportforen/smarthome-py/1021844-neues-database-plugin

    version: 1.8.0                # Plugin version
    sh_minversion: '1.12.2'         # minimum shNG version to use this plugin
#    sh_maxversion:                # maximum shNG version to use this plugin (leave empty if latest)
    multi_instance: true           # plugin supports multi instance
    restartable: true
    startorder: early              # set start priority of plugin (early/normal/late)
    classname: Database            # class containing the plugin

parameters:
    # Definition of parameters to be configured in etc/plugin.yaml

    # --- general (all drivers) ------------------------------------------------
    driver:
        type: str
        default: 'sqlite3'
        valid_list_ci:
            - 'sqlite3'
            - 'pymysql'
            - 'psycopg2'
            - 'psycopg'
            - 'mysql'
            - 'mariadb'
            - 'postgres'
            - 'postgresql'
            - 'timescale'
            - 'timescaledb'
        description:
            de: "Das DB-API2-Treibermodul. Akzeptiert die echten Modulnamen ('sqlite3', 'pymysql', 'psycopg2', 'psycopg') sowie entsprechende Datenbank-Namen: 'mysql'/'mariadb', 'postgres'/'postgresql'/'timescale'/'timescaledb'."
            en: "The DB-API2 driver module: 'sqlite3', 'pymysql', 'psycopg2'/'psycopg', or a matching database name ('mysql'/'mariadb', 'postgres'/'postgresql'/'timescale'/'timescaledb')."
    connect:
        type: list(str)
        mandatory: true
        description:
            de: "Die Verbindungsparameter für die connect()-Funktion des DB-API2-Treibers. Beispiel für pymysql: connect = host:127.0.0.1 | user:db_user | passwd:db_password | db:smarthome. Beispiel für psycopg2/psycopg: connect = host:127.0.0.1 | port:5432 | user:db_user | password:db_password | database:smarthome."
            en: "The connection parameters for the DB-API2 driver's connect() function. Example for pymysql: connect = host:127.0.0.1 | user:db_user | passwd:db_password | db:smarthome. Example for psycopg2/psycopg: connect = host:127.0.0.1 | port:5432 | user:db_user | password:db_password | database:smarthome."
    prefix:
        type: str
        default: ''
        description:
            de: 'Ein Präfix, das vor die Tabellennamen des Plugins gestellt wird - nützlich, um mit anderen Tabellen in derselben Datenbank zu koexistieren.'
            en: "A prefix placed before the plugin's own table names - useful to coexist with other tables in the same database."
    cycle:
        type: int
        default: 60
        description:
            de: 'Wie oft (in Sekunden) gepufferte Werte in die Datenbank geschrieben werden.'
            en: 'How often (in seconds) buffered values are written to the database.'
    precision:
        type: int
        default: 2
        description:
            de: 'Nachkommastellen der aus der Datenbank gelesenen Werte.'
            en: 'Decimal places of values read from the database.'
    time_precision:
        type: int
        default: 3
        valid_min: 0
        valid_max: 3
        description:
            de: 'Nachkommastellen (für Sekunden) der aus der Datenbank gelesenen Zeitwerte.'
            en: 'Decimal places (for seconds) of time values read from the database.'
    count_logentries:
        type: bool
        default: false
        description:
            de: 'Zeigt im Web-Interface eine zusätzliche Spalte mit der Anzahl der Datenbankeinträge je Item an.'
            en: 'Shows an extra column with the number of database entries per item in the web interface.'
    max_delete_logentries:
        type: int
        default: 20000
        valid_min: 1000
        description:
            de: 'Maximale Anzahl an Datenbankeinträgen mit database_maxage-Attribut, die in einem Durchlauf gelöscht werden - begrenzt die Last auf der Datenbank bei großen Altbeständen.'
            en: 'Maximum number of database entries with the database_maxage attribute deleted in one run - limits the load on the database with large amounts of old data.'
    max_reassign_logentries:
        type: int
        default: 20000
        valid_min: 100
        description:
            de: 'Maximale Anzahl an Datenbankeinträgen, die in einem Durchlauf neu einem Item zugewiesen werden - begrenzt die Last auf der Datenbank bei großen Datenbeständen.'
            en: 'Maximum number of database entries reassigned to an item in one run - limits the load on the database with large datasets.'
    default_maxage:
        type: int
        default: 0
        valid_min: 0
        description:
            de: 'Ist dieser Wert größer 0, gilt er als Standard-database_maxage für Items ohne eigenes database_maxage.'
            en: 'If this value is greater than 0, it acts as the default database_maxage for items without their own database_maxage.'
    default_maxage_action:
        type: str
        default: 'delete'
        valid_list_ci: ['delete', 'avg', 'sum', 'min', 'max', 'integrate', 'duty_cycle', 'on', 'countall', 'first', 'last']
        description:
            de: "Standardaktion für Items mit database_maxage, die kein eigenes database_maxage_action gesetzt haben. 'on' ist ein veralteter Alias für 'duty_cycle'."
            en: "Default action for items with database_maxage that don't have their own database_maxage_action set. 'on' is a legacy alias for 'duty_cycle'."
    default_maxage_interval:
        type: str
        default: '24h'
        description:
            de: "Standard-Kompaktierungsintervall für Items, die kein eigenes database_maxage_interval gesetzt haben (nur relevant, wenn database_maxage_action des Items nicht 'delete' ist). Angabe in Sekunden, Minuten (m) oder Stunden (h), auch kombinierbar (z.B. '30m', '2h30m'). Tage müssen in Stunden angegeben werden (z.B. 7 Tage = '168h')."
            en: "Default compaction interval for items without their own database_maxage_interval set (only relevant when the item's database_maxage_action is not 'delete'). Given in seconds, minutes (m) or hours (h), combinable (e.g. '30m', '2h30m'). Days must be given as hours (e.g. 7 days = '168h')."
    max_aggregate_intervals:
        type: int
        default: 30
        valid_min: 1
        description:
            de: "Maximale Anzahl an Kompaktierungsintervallen, die pro Durchlauf und Item verarbeitet werden - begrenzt die Last auf der Datenbank bei großen Altbeständen. Gilt nur für die Plugin-seitige Kompaktierung, nicht bei timescale_native_aggregation: true."
            en: "Maximum number of compaction intervals processed per item per run - limits the load on the database with large amounts of old data. Only applies to plugin-side compaction, not with timescale_native_aggregation: true."
    removeold_cycle:
        type: int
        default: 91
        description:
            de: "Wie oft (in Sekunden) auf veraltete Datenbankeinträge (database_maxage) geprüft wird. Ohne Wirkung bei timescale_native_aggregation: true."
            en: "How often (in seconds) database entries are checked against database_maxage. Has no effect with timescale_native_aggregation: true."
    invalid_check_cycle:
        type: int
        default: 60
        valid_min: 1
        description:
            de: 'Wie oft (in Sekunden) Items mit database_invalid_after geprüft werden.'
            en: 'How often (in seconds) items with database_invalid_after are checked.'
    invalid_check_grace_time:
        type: int
        default: 60
        valid_min: 0
        description:
            de: 'Zusätzliche Karenzzeit (in Sekunden), die nach dem Start des Plugins gewartet wird, bevor die Prüfung des invalid_check_cycle startet.'
            en: 'Extra grace time (in seconds) waited after plugin startup before the invalid_check_cycle check starts.'

    # --- SQLite3 only ----------------------------------------------------------
    sqlite_wal_mode:
        type: bool
        default: false
        description:
            de: "Nur für SQLite3 (driver: sqlite3): Versetzt die Datenbankdatei in den WAL-Journal-Modus - erlaubt parallele Schreib- und Lesevorgänge. ACHTUNG: Dies ist eine Einwegentscheidung - WAL ist eine Eigenschaft der Datenbankdatei selbst, bleibt über Neustarts hinweg bestehen und wird von jeder künftigen Verbindung (auch von anderen Tools) übernommen. Diesen Parameter später wieder auf False zu setzen, macht eine bereits umgestellte Datei nicht rückgängig."
            en: "SQLite3 only (driver: sqlite3): Switches the database file to WAL journal mode - allows parallel writes and reads. WARNING: this is a one-way decision - WAL is a property of the database file itself, persists across restarts, and is picked up by any future connection (including other tools). Setting this parameter back to False later does not revert an already-converted file."
    copy_database:
        type: bool
        default: false
        description:
            de: 'Nur für SQLite3 (driver: sqlite3): Erzeugt beim Start von SmartHomeNG eine Kopie der Datenbankdatei.'
            en: 'SQLite3 only (driver: sqlite3): Creates a copy of the database file on SmartHomeNG startup.'
    copy_database_name:
        type: str
        description:
            de: 'Nur für SQLite3 (driver: sqlite3): Pfad/Name der Datenbank-Kopie.'
            en: 'SQLite3 only (driver: sqlite3): Path/name of the database copy.'

    # --- PostgreSQL+TimescaleDB only (driver: psycopg2/psycopg) ----------------
    timescale_hypertable:
        type: bool
        default: true
        description:
            de: "Nur für PostgreSQL: Aktiviert die TimescaleDB-Extension und wandelt die log-Tabelle in eine Hypertable um - beschleunigt zeitbereichsbasierte Abfragen (Graphen, Statistiken) auf großen Tabellen erheblich. Setzt voraus, dass TimescaleDB auf dem PostgreSQL-Server installiert ist; falls nicht, wird eine Warnung ausgegeben und das Feature bleibt inaktiv, der Rest des Plugins funktioniert unverändert."
            en: "PostgreSQL only (driver: psycopg2/psycopg): Enables the TimescaleDB extension and converts the log table into a hypertable - substantially speeds up time-range queries (graphs, statistics) on large tables. Requires TimescaleDB to be installed on the PostgreSQL server; if it isn't, a warning is logged and the feature stays inactive, the rest of the plugin works unchanged."
    timescale_chunk_interval:
        type: str
        default: '168h'
        description:
            de: "Nur für PostgreSQL mit timescale_hypertable aktiv: Größe der Zeitpartitionen, in die die log-Tabelle aufgeteilt wird. Angabe in Sekunden, Minuten (m) oder Stunden (h), auch kombinierbar (z.B. '30m', '2h30m'). Tage müssen in Stunden angegeben werden (z.B. 7 Tage = '168h'). Gilt nur für neu angelegte Partitionen, bestehende werden nicht verändert."
            en: "PostgreSQL with timescale_hypertable enabled only: size of the time partitions the log table is split into. Given in seconds, minutes (m) or hours (h), combinable (e.g. '30m', '2h30m'). Days must be given as hours (e.g. 7 days = '168h'). Only applies to newly created partitions, existing ones are unaffected."
    timescale_compress:
        type: bool
        default: false
        description:
            de: "Nur für PostgreSQL mit timescale_hypertable aktiv: Aktiviert native spaltenbasierte Kompression der log-Tabelle. Die aktuellste Zeitpartition bleibt unkomprimiert. Diesen Parameter auf False zurückzusetzen deaktiviert nur künftige Aktivierungsversuche, hebt bereits aktive Kompression nicht auf."
            en: "PostgreSQL with timescale_hypertable enabled only: enables native columnar compression on the log table. The most recent time partition stays uncompressed. Setting this back to False only stops future activation, it does not undo compression already active."
    timescale_native_aggregation:
        type: bool
        default: false
        description:
            de: "Nur für PostgreSQL mit timescale_hypertable aktiv: False (Standard) nutzt die bestehende Python-seitige Kompaktierung (wie bei sqlite3/MySQL). True nutzt stattdessen TimescaleDB Continuous Aggregates. Ein Wechsel von True zurück zu False ist nicht vorgesehen und kann nicht verlustfrei erfolgen."
            en: "PostgreSQL with timescale_hypertable enabled only: False (default) uses the existing Python-side compaction (same as sqlite3/MySQL). True uses TimescaleDB Continuous Aggregates instead. Switching from True back to False is not implemented and not possible without data loss."
    timescale_native_retention:
        type: bool
        default: false
        description:
            de: "Nur für PostgreSQL mit timescale_native_aggregation aktiv: Entfernt alte Rohdaten-Zeitpartitionen automatisch auf dem Datenbank-Server, statt diese vom Plugin einzeln zu löschen. Die Löschung erfolgt partitionsweise für alle Items, nicht garantiert nach Ablauf der pro Item eingestellten Zeit. ACHTUNG: Es werden ALLE Items gelöscht, nicht nur die mit eingestelltem database_maxage. Ein unbegrenztes Aufbewahren ist in diesem Modus nicht möglich. Es wird empfohlen, default_maxage > 0 und default_maxage_action != 'delete' zu setzen."
            en: "PostgreSQL with timescale_native_aggregation enabled only: automatically drops old raw-data time partitions on the database server, instead of the plugin deleting them individually. Deletion happens partition-wise for all items, not guaranteed to happen once each item's own configured time has elapsed. CAUTION: ALL items' data is dropped, not only items with database_maxage set. Unlimited retention is not possible in this mode. It is recommended to set default_maxage > 0 and default_maxage_action != 'delete'."

item_attributes:
    # Definition of item attributes defined by this plugin

    # --- core --------------------------------------------------------------
    database:
        type: str
        valid_list_ci: ['', 'init', 'true', 'false', 'no', 'yes']
        duplicate_use: true
        description:
            de: "Bei 'yes' oder 'true' werden Wertänderungen des Items in die Datenbank geschrieben. Bei 'init' wird zusätzlich beim Start von SmartHomeNG der letzte Wert des Items aus der Datenbank gelesen."
            en: "With 'yes' or 'true', the item's value changes are written to the database. With 'init', the item's last value is additionally read back from the database on SmartHomeNG startup."
    database_acl:
        type: str
        valid_list_ci: ['rw', 'ro']
        default: 'rw'
        description:
            de: "'rw' (Standard) schreibt Wertänderungen normal in die Datenbank. 'ro' unterdrückt das Schreiben für dieses Item - nützlich, wenn die Datenbank für dieses Item bereits Daten aus einer anderen Quelle enthält, die nicht überschrieben werden sollen."
            en: "'rw' (default) writes value changes to the database normally. 'ro' suppresses writing for this item - useful when the database already holds data for this item from another source that should not be overwritten."
    database_write_on_shutdown:
        type: bool
        default: true
        description:
            de: "Schreibt den Itemwert beim Beenden von SmartHomeNG erneut in die Datenbank, auch ohne echte Änderung (Standard: True). Bei False entfällt dieses abschließende Schreiben."
            en: "Writes the item value to the database once more on SmartHomeNG shutdown, even without a real change (default: True). With False, this final write is skipped."

    # --- database_maxage (compaction/deletion of old data) -----------------
    database_maxage:
        type: num
        valid_min: 0
        description:
            de: 'Maximales Alter (in Tagen) der Datenbankeinträge, die für dieses Item behalten werden. Ohne Angabe werden die Werte unbegrenzt gespeichert.'
            en: 'Maximum age (in days) of the database entries kept for this item. If not set, values are kept indefinitely.'
    database_maxage_action:
        type: str
        valid_list_ci: ['delete', 'avg', 'sum', 'min', 'max', 'integrate', 'duty_cycle', 'on', 'countall', 'first', 'last']
        description:
            de: "Aktion, die beim Erreichen von database_maxage auf ältere Datenbankeinträge angewendet wird. 'delete' (Standard) löscht die Einträge ersatzlos; jeder andere Wert ersetzt sie durch einen Kompaktierungswert pro database_maxage_interval statt sie zu löschen. 'duty_cycle' (nur bool-Items) berechnet den zeitgewichteten Ein-Anteil. 'on' ist ein veralteter Alias für 'duty_cycle', nur aus Kompatibilitätsgründen akzeptiert. Ohne eigenen Wert gilt der Plugin-Parameter default_maxage_action."
            en: "Action applied to database entries older than database_maxage. 'delete' (default) removes them outright; any other value replaces them with one compacted value per database_maxage_interval instead of deleting them. 'duty_cycle' (bool items only) computes the time-weighted on-fraction. 'on' is a legacy alias for 'duty_cycle', accepted for compatibility only. Without its own value, the default_maxage_action plugin parameter applies."
    database_maxage_interval:
        type: str
        description:
            de: "Kompaktierungsintervall, nur relevant wenn database_maxage_action nicht 'delete' ist. Angabe in Sekunden, Minuten (m) oder Stunden (h), auch kombinierbar (z.B. '30m', '2h30m'). Tage müssen in Stunden angegeben werden (z.B. 7 Tage = '168h'). Ohne eigenen Wert gilt der Plugin-Parameter default_maxage_interval."
            en: "Compaction interval, only relevant when database_maxage_action is not 'delete'. Given in seconds, minutes (m) or hours (h), combinable (e.g. '30m', '2h30m'). Days must be given as hours (e.g. 7 days = '168h'). Without its own value, the default_maxage_interval plugin parameter applies."

    # --- database_invalid_after (auto-invalidate on no changes/updates) ----
    database_invalid_after:
        type: str
        description:
            de: "Maximale Zeit ohne Änderungen oder Updates, nach der ein Item automatisch als ungültig markiert wird - sinnvoll nur bei Items mit regelmäßigen Aktualisierungen (z.B. über cycle/crontab). Angabe in Sekunden, Minuten (m) oder Stunden (h), auch kombinierbar (z.B. '30s', '5m'). Erfordert das Item-Attribut 'enforce_updates'. Nicht mit database_acl: ro kombinierbar."
            en: "Maximum time without changes or updates after which an item is automatically marked invalid - useful only for items with regular updates (e.g. via cycle/crontab). Given in seconds, minutes (m) or hours (h), combinable (e.g. '30s', '5m'). Requires the item attribute 'enforce_updates'. Not compatible with database_acl: ro."


item_structs:
# helper structs to add min/max histories to items with database_maxage_action: avg/int
    min:
        on_change: .db_min = value
        db_min:
            type: num
            database: true
            database_maxage_action: min

    max:
        on_change: .db_max = value
        db_max:
            type: num
            database: true
            database_maxage_action: max

logic_parameters: NONE
    # Definition of logic parameters defined by this plugin

plugin_functions:
    # Definition of function interface of the plugin
    id:
        type: int
        description:
            de: 'Liefert die Datenbank-ID für das angegebene Item.'
            en: 'Returns the database ID for the given item.'
        parameters:
            item:
                type: foo
                description:
                    de: "Das Item-Objekt."
                    en: "An item object."
            create:
                type: bool
                description:
                    de: "Falls True, wird das Item in der Datenbank angelegt, falls es dort noch nicht existiert."
                    en: "If True, the item is created in the database if it does not exist yet."
            cur:
                type: foo
                description:
                    de: "Ein Datenbankcursor-Objekt, falls vorhanden (optional)."
                    en: "A database cursor object, if available (optional)."

    db:
        type: foo
        description:
            de: 'Liefert das Low-Level-Datenbankobjekt.'
            en: 'Returns the low-level database object.'

    dump:
        type: void
        description:
            de: 'Erzeugt einen Datenbank-Dump anhand der angegebenen Kriterien.'
            en: 'Creates a database dump for the given criteria.'
        parameters:
            dumpfile:
                type: str
                description:
                    de: "Dateiname, in den der Dump geschrieben wird."
                    en: "Filename to write the dump to."
            id:
                type: int
                description:
                    de: "Schränkt den Dump auf die angegebene Item-ID ein (optional)."
                    en: "Restricts the dump to the given item ID (optional)."
            time:
                type: int
                description:
                    de: "Schränkt den Dump auf die angegebene Zeit ein (optional)."
                    en: "Restricts the dump to the given time (optional)."
            time_start:
                type: int
                description:
                    de: "Schränkt den Dump auf die angegebene Startzeit ein (optional)."
                    en: "Restricts the dump to the given start time (optional)."
            time_end:
                type: int
                description:
                    de: "Schränkt den Dump auf die angegebene Endzeit ein (optional)."
                    en: "Restricts the dump to the given end time (optional)."
            changed:
                type: int
                description:
                    de: "Schränkt den Dump auf die angegebene Änderungszeit ein (optional)."
                    en: "Restricts the dump to the given time of change (optional)."
            changed_start:
                type: int
                description:
                    de: "Schränkt den Dump auf die angegebene Startzeit von Änderungen ein (optional)."
                    en: "Restricts the dump to the given start time of changes (optional)."
            changed_end:
                type: int
                description:
                    de: "Schränkt den Dump auf die angegebene Endzeit von Änderungen ein (optional)."
                    en: "Restricts the dump to the given end time of changes (optional)."
            cur:
                type: foo
                description:
                    de: "Ein Datenbankcursor-Objekt, falls vorhanden (optional)."
                    en: "A database cursor object, if available (optional)."

    insertItem:
        type: int
        description:
            de: 'Legt einen Item-Datenbankeintrag für die angegebene Datenbank-ID an.'
            en: 'Creates a database item record for the given database ID.'
        parameters:
            name:
                type: str
                description:
                    de: "Name des Items, für das ein Eintrag angelegt wird."
                    en: "Name of the item to create a record for."
            cur:
                type: foo
                description:
                    de: "Ein Datenbankcursor-Objekt, falls vorhanden (optional)."
                    en: "A database cursor object, if available (optional)."

    updateItem:
        type: void
        description:
            de: 'Aktualisiert den Item-Datenbankeintrag für die angegebene Datenbank-ID.'
            en: 'Updates the database item record for the given database ID.'
        parameters:
            id:
                type: int
                description:
                    de: "Datenbank-ID des Items, dessen Eintrag aktualisiert wird."
                    en: "Database ID of the item whose record is updated."
            time:
                type: int
                description:
                    de: "Zeitpunkt, ab dem der Wert galt."
                    en: "Time from which the value was in effect."
            duration:
                type: int
                description:
                    de: "Zeitspanne, für die der Wert galt."
                    en: "Duration for which the value was in effect."
            val:
                type: str
                description:
                    de: "Der Wert, der in die Datenbank geschrieben wird."
                    en: "The value to write to the database."
            it:
                type: str
                description:
                    de: "Der Item-Typ des Wertes ('str', 'num', 'bool')."
                    en: "The item type of the value ('str', 'num', 'bool')."
            changed:
                type: int
                description:
                    de: "Zeitstempel der Änderung."
                    en: "Timestamp of the change."
            cur:
                type: foo
                description:
                    de: "Ein Datenbankcursor-Objekt, falls vorhanden (optional)."
                    en: "A database cursor object, if available (optional)."

    readItem:
        type: foo
        description:
            de: "Liest den Item-Datenbankeintrag für die angegebene Datenbank-ID.

                 Diese Methode liest die Item-Daten einschließlich aller Felder. Ist der Parameter id
                 ein String, wird das Item über seinen Namen ausgewählt statt über seine Datenbank-ID.
                "
            en: "Reads the database item record for the given database ID.

                 This method reads the item data including all fields. If the id parameter is a
                 string, the item is selected by its name instead of its database ID.
                "
        parameters:
            id:
                type: int/str
                description:
                    de: "Datenbank-ID (oder Name) des Items, dessen Eintrag gelesen wird."
                    en: "Database ID (or name) of the item whose record is read."
            cur:
                type: foo
                description:
                    de: "Ein Datenbankcursor-Objekt, falls vorhanden (optional)."
                    en: "A database cursor object, if available (optional)."

    readItems:
        type: foo
        description:
            de: 'Liest alle Item-Datenbankeinträge einschließlich aller Felder.'
            en: 'Reads all database item records, including all fields.'
        parameters:
            cur:
                type: foo
                description:
                    de: "Ein Datenbankcursor-Objekt, falls vorhanden (optional)."
                    en: "A database cursor object, if available (optional)."

    deleteItem:
        type: void
        description:
            de: 'Löscht einen Item-Datenbankeintrag und die zugehörigen Log-Datenbankeinträge.'
            en: "Deletes an item's database record and its associated log database records."
        parameters:
            id:
                type: int
                description:
                    de: "Datenbank-ID des Items, dessen Eintrag gelöscht wird."
                    en: "Database ID of the item whose record is deleted."
            cur:
                type: foo
                description:
                    de: "Ein Datenbankcursor-Objekt, falls vorhanden (optional)."
                    en: "A database cursor object, if available (optional)."

    insertLog:
        type: void
        description:
            de: 'Legt einen Log-Datenbankeintrag für die angegebene Datenbank-ID an.'
            en: 'Creates a database log record for the given database ID.'
        parameters:
            id:
                type: int
                description:
                    de: "Datenbank-ID des Items, für das ein Eintrag angelegt wird."
                    en: "Database ID of the item to create a record for."
            time:
                type: int
                description:
                    de: "Zeitpunkt, ab dem der Wert galt."
                    en: "Time from which the value was in effect."
            duration:
                type: int
                description:
                    de: "Zeitspanne, für die der Wert galt."
                    en: "Duration for which the value was in effect."
            val:
                type: str
                description:
