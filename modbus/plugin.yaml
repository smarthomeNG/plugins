# Metadata for the Smart-Plugin
plugin:
    # Global plugin attributes
    type: gateway
    description:
        de: 'Plugin zur Geräte-Anbindung über ModBus an SmartHomeNG'
        en: 'Plugin to connect via modbus with SmartHomeNG'
    maintainer: CaeruleusAqua, ivande, Cannon
    tester: onkelandy                   # Who tests this plugin?
    state: develop
    keywords: modbus modbus_tcp tcp smartmeter inverter heatpump
    #documentation: http://smarthomeng.de/user/plugins/modbus/user_doc.html
    support: https://knx-user-forum.de/forum/supportforen/smarthome-py/1154368-einbindung-von-modbus-tcp
    version: 0.1.0                 # Plugin version
    sh_minversion: '2.0.0'          # minimum shNG version to use this plugin
    #sh_maxversion:                # maximum shNG version to use this plugin (leave empty if latest)
#   py_minversion:
    # py_maxversion:               # maximum Python version to use for this plugin (leave empty if latest)
    multi_instance: true           # plugin supports multi instance
    restartable: true
    classname: Modbus              # class containing the plugin

parameters:
    transport:
        type: str
        default: tcp
        valid_list:
            - tcp
            - rtu
            - rtu_over_tcp
        description:
            de: 'Verbindung: Modbus TCP, Modbus RTU an einer seriellen Schnittstelle, oder RTU-Telegramme über TCP (serielle Gateways)'
            en: 'Connection: Modbus TCP, Modbus RTU on a serial port, or RTU frames over TCP (serial gateways)'

    host:
        type: str
        default: ''
        description:
            de: 'Hostname oder IP-Adresse des Modbus-Geräts bzw. Gateways (tcp, rtu_over_tcp)'
            en: 'Host name or IP address of the Modbus device or gateway (tcp, rtu_over_tcp)'

    port:
        type: int
        default: 502
        valid_min: 1
        valid_max: 65535
        description:
            de: 'TCP-Port (tcp, rtu_over_tcp)'
            en: 'TCP port (tcp, rtu_over_tcp)'

    serialport:
        type: str
        default: ''
        description:
            de: 'Serielle Schnittstelle, z.B. /dev/ttyUSB0 (rtu); pyserial-URLs wie socket://host:port sind erlaubt'
            en: 'Serial port, e.g. /dev/ttyUSB0 (rtu); pyserial URLs such as socket://host:port are accepted'

    baudrate:
        type: int
        default: 19200
        valid_list: [1200, 2400, 4800, 9600, 19200, 38400, 57600, 115200]
        description:
            de: 'Baudrate (rtu)'
            en: 'Baud rate (rtu)'

    parity:
        type: str
        default: 'N'
        valid_list: ['N', 'E', 'O']
        description:
            de: 'Parität: N (keine), E (gerade), O (ungerade) (rtu)'
            en: 'Parity: N (none), E (even), O (odd) (rtu)'

    stopbits:
        type: int
        default: 1
        valid_list: [1, 2]
        description:
            de: 'Stoppbits (rtu)'
            en: 'Stop bits (rtu)'

    bytesize:
        type: int
        default: 8
        valid_list: [7, 8]
        description:
            de: 'Datenbits (rtu)'
            en: 'Data bits (rtu)'

    cycle:
        type: int
        default: 300
        valid_min: -1
        description:
            de: 'Abfragezyklus in Sekunden: positiv = periodisch, 0 = nur Crontab, -1 = kontinuierlich.'
            en: 'Read cycle in seconds: positive = periodic, 0 = crontab only, -1 = continuous.'

    crontab:
        type: str
        description:
            de: 'Update mit Festlegung via Crontab'
            en: 'Update by means of a crontab'

    slaveUnit:
        type: int
        default: 1
        description:
            de: 'Slave-Addresse der zu lesenden Modbus-Einheit'
            en: 'slave-address of the Modbus-Unit to read'

    adapter:
        type: str
        default: ''
        valid_list:
            - ''
            - pluggit
        description:
            de: 'Geräte-Logik über reine Register hinaus: pluggit = Betriebsart-Schalter (modBusBit auf Register 168) und Umschalten auf Handbetrieb vor dem Schreiben der Lüfterstufe'
            en: 'Device logic beyond plain registers: pluggit = unit mode switches (modBusBit on register 168) and switching to manual mode before the speed level is written'

    pause_item:
        type: str
        default: ''
        description:
            de: 'Item, um die Ausführung des Plugins zu steuern'
            en: 'item for controlling plugin execution'

    invalidate_on_disconnect:
        type: bool
        default: false
        description:
            de: 'Gelesene Items bei Verbindungsverlust im Datenbank-Log als ungültig markieren (Datenlücke)'
            en: 'mark read items invalid in the database log when the connection is lost (data gap)'


item_attributes:
    modbusPoll:
        type: bool
        description:
            de: 'Bei true am Item eine einmalige Abfrage aller Register auslösen (auch mit cycle: 0).'
            en: 'Trigger one read pass of all registers when the item is true (also with cycle: 0).'

    modBusObjectType:
        type: str
        default: 'HoldingRegister'
        description:
            de: 'Auswahl welcher Objekt-Type gelesen werden soll'
            en: 'Selection of which object type should be read '
        valid_list:
            - 'Coil'
            - 'DiscreteInput'
            - 'InputRegister'
            - 'HoldingRegister'

    modBusAddress:
        type: num
        description:
            de: 'Register Adresse welche gelesen werden soll'
            en: 'register address to read'

    modBusUnit:
        type: num
        default: 1  # als default wird die slaveUnit aus der plugin-Konfig verwendet
        description:
            de: 'Slave-Addresse der zu lesenden Modbus-Einheit (Unit aus der plugin-Konfig wird überschrieben)'
            en: 'slave-address of the Modbus-Unit to read - (Value from plugin config will be overwritten)'

    modBusDataType:
        type: str
        default: 'uint16'
        description:
            de: 'Datentyp vom zu lesenden Register (bit, int16 uint16 int32 uint32 float32 string16 stringNN)'
            en: 'datatype from register to read (bit, int16 uint16 int32 uint32 float32 string16 stringNN)'

    modBusDirection:
        type: str
        default: 'read'
        description:
            de: 'Datenrichtung'
            en: 'data direction'
        valid_list:
            - 'read'
            - 'read_write'
            - 'write'

    modBusByteOrder:
        type: str
        default: 'Endian.BIG'
        description:
            de: 'Endian.BIG oder Endian.LITTLE'
            en: 'Endian.BIG or Endian.LITTLE'
        valid_list:
            - 'Endian.BIG'
            - 'Endian.LITTLE'

    modBusWordOrder:
        type: str
        default: 'Endian.BIG'
        description:
            de: 'Endian.BIG oder Endian.LITTLE'
            en: 'Endian.BIG or Endian.LITTLE'
        valid_list:
            - 'Endian.BIG'
            - 'Endian.LITTLE'

    modBusFactor:
        type: num
        default: 1
        description:
            de: 'Faktor mit dem der gelesene Register-Wert multipliziert wird'
            en: 'Factor by which the read register value is multiplied'

    modBusSunSpec:
        type: str
        description:
            de: 'SunSpec-Punkt statt modBusAddress: <Modell>[:<Instanz>].<Punkt>, z.B. 103.W oder 160.module.2.DCW; Adresse und Skalierung liest das Plugin beim Verbinden vom Gerät'
            en: 'SunSpec point instead of modBusAddress: <model>[:<instance>].<point>, e.g. 103.W or 160.module.2.DCW; address and scaling are read from the device on connect'

    modBusInvalid:
        type: list
        description:
            de: 'Gelesene Werte (vor modBusFactor), die das Gerät zusätzlich zu den Datentyp-Werten für "kein Wert" verwendet, z.B. [32767]'
            en: 'Values read (before modBusFactor) the device uses for "no value" in addition to the datatype ones, e.g. [32767]'

    modBusInvalidValue:
        type: foo
        description:
            de: 'Item-Wert, wenn das Gerät "kein Wert" meldet (z.B. 0x80000000 bei int32); ohne Angabe bleibt das Item unverändert. Wird ohne modBusFactor übernommen.'
            en: 'Item value when the device reports "no value" (e.g. 0x80000000 for int32); unset leaves the item unchanged. Used as is, without modBusFactor.'

    modBusBit:
        type: int
        description:
            de: 'Item-Wert ist dieses Bit (0 = niederwertigstes) des gelesenen Werts, als bool; modBusFactor gilt nicht. Schreiben nur über einen Adapter.'
            en: 'Item value is this bit (0 = least significant) of the value read, as bool; modBusFactor does not apply. Written only through an adapter.'

    modBusRound:
        type: int
        description:
            de: 'Gelesene Werte auf so viele Nachkommastellen runden (0 = ganze Zahl), nach modBusFactor; str-Items erhalten Text mit genau so vielen Nachkommastellen'
            en: 'Round values read to this many decimals (0 = integer), after modBusFactor; str items get text with exactly this many decimals'

    modBusLookup:
        type: dict
        description:
            de: 'Werteliste Gerätewert: Item-Wert, z.B. {0: Standby, 1: Manuell}; Schreiben setzt den Gerätewert des Item-Werts. Nicht gelistete Gerätewerte werden unverändert übernommen.'
            en: 'Value list device value: item value, e.g. {0: Standby, 1: Manual}; writes send the device value of the item value. Device values not listed pass unchanged.'

