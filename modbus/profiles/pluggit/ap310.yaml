# Pluggit AP310 air handler, converted from the pluggit plugin (struct pluggit.pluggit): same
# item names and paths. Needs the plugin parameter `adapter: pluggit` for the unit mode switches
# (CurrentUnitMode.*, Bypass.ManualMode) and the speed level (switches to manual mode first).
# Parameters are 32-bit, low word first; read-only ones are read as their low word (uint16),
# writable ones written as both words (uint32), as the pluggit plugin did.
# Differences to the pluggit plugin:
# - FirmwareVersion, HACFirmwareVersion: str ('2.19') instead of num
# - SystemTime.DateTime: item type datetime instead of foo
# - SystemTime.Set: new, write-only; SystemTime and SystemTime.DateTime are read-only
#   (the pluggit plugin wrote SystemTime to register 110, which Set does now)
# - WeekProgram: read-only (the pluggit plugin read 466 but wrote 467); the day programs
#   (Monday..Sunday) are left out, the pluggit plugin never decoded them
vendor: pluggit
device: ap310
title: Pluggit AP310 air handler
tier: shipped
tested_with: []
defaults:
    word_order: little
