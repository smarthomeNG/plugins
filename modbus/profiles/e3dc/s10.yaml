# E3/DC S10 home power station, Modbus TCP "simple mode" (protocol "E3/DC" in the device's
# Smart Home > Modbus menu, port 502, unit id 1). Addresses are 0-based (E3/DC documents them
# 1-based: 40001 = magic; register document "Modbus/TCP-Schnittstelle" V2.30, 2024-10-22).
# 32-bit values: low word first. Not mapped: DC string 3 (unused), the int16 copies of the meter
# phases (doc 40106-40136), additional inverters 1-7 (40999 + 34 * index, same layout as
# `inverter`), wallbox bit writes (function 05h, coil address undocumented).
# The protocol setting "SunSpec" replaces this block (40000 = 'SunS'); its battery models carry no
# values, so simple mode is the one to use.
vendor: e3dc
device: s10
title: E3/DC S10 (simple mode)
tier: shipped
tested_with: ['S10 SE, firmware H20_2026_44, simple mode 1.2']
defaults:
    word_order: little
groups:
    info:
        description: Device identification
        magic:
            address: 40000
            datatype: uint16
            type: num
            description: Identifier, 0xE3DC (58332) when the simple mode is active
