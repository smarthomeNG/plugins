# SAMSON TROVIS 5571/5573/5576/5578/5579 heating controller, converted from the trovis557x plugin
# (register and coil tables of plugin version 2.0.1). Optional profile: export it with
#   python -m plugins.modbus.profiles export samson.trovis557x --structs-dir <conf>/structs
# Every point is a top-level group, named after the trovis557x_var short name ('-', '#' become '_'),
# so an item moves over by replacing `trovis557x_var: <name>` with
# `struct: my.modbus_samson.trovis557x.<name>`. Registers a model lacks are dropped by the plugin
# (illegal data address) until the next connection.
# Differences to the trovis557x plugin:
# - list registers: the item holds the number, the child `text` the list entry (the trovis557x
#   plugin put the entry into item.conf['liste'] only); coils are bool, `Liste_FA`/`Liste_FS`
#   coils get a `text` child too
# - Uhrzeit: '09:05' instead of '9:05' (datatype hhmm); Datum unchanged ('15.03.', ddmm)
# - signed measurements: 32767 (no sensor) leaves the item unchanged instead of 3276.7;
#   `modBusInvalidValue: 0` on the item replaces `invalid_to_zero: true`
# - item attribute `liste` (bus value, value, unit) is gone; the unit is in the description
# - points with `Art: rw` in the trovis557x tables (setpoints, clock, switches) are `read_write`; the
#   trovis557x plugin never wrote. The export is read-only unless `--writable`; the item remark
#   'writable (...)' marks them either way, and `modBusDirection: read_write` on an item enables a
#   single one in a read-only export
